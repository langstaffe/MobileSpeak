[package]
name = "mobilespeak_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio"] }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
audiopus = "0.3.0-rc.0"
audiopus_sys = { version = "0.2", features = ["static"] }
nnnoiseless = { version = "0.5.2", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
