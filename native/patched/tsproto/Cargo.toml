[package]
name = "tsproto"
version = "0.2.0"
authors = ["Flakebi <flakebi@t-online.de>"]
description = "An implementation of the TeamSpeak3 protocol as a library for use in clients and bots."
repository = "https://github.com/ReSpeak/tsclientlib"
readme = "README.md"
keywords = ["teamspeak3", "ts3", "voip"]
categories = ["multimedia"]
license = "MIT OR Apache-2.0"
edition = "2018"
autobenches = false
include = [
	"/Cargo.toml",
	"/README.md",
	"**/*.rs",
]

[dependencies]
aes = "0.8"
base64 = "0.22"
omnom = "3"
curve25519-dalek-ng = "4"
eax = "0.5"
futures = "0.3"
generic-array = "0.14"
git-testament = "0.2"
num-bigint = "0.4"
num-derive = "0.4"
num-traits = "0.2"
pin-project-lite = "0.2"
rand = "0.10"
rug = { version = "1", optional = true, default-features = false, features = ["integer"] }
serde = { version = "1", features = ["derive"] }
sha-1 = "0.10"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tracing = "0.1"
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
quicklz = "0.3"

[dev-dependencies]
anyhow = "1"
once_cell = "1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt", "test-util"] }
